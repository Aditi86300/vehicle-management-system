# ---- Server ----
server.port=8080

# ---- PostgreSQL Database connection ----
# Apna DB naam/username/password yahan daalein
spring.datasource.url=jdbc:postgresql://localhost:5432/carrental_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update  -> Hibernate khud tables bana/update kar dega Entity classes dekh kar
#                     (production me isse "validate" ya migration tool jaise Flyway use karte hain)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# data.sql tab chalayen jab tables already ban chuki hain (import ke baad)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
